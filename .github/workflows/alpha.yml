name: Snap Hutao Remastered Alpha
on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    paths-ignore:
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.resx'

jobs:
  test:
    name: Runtime behavior regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Exploratory IncomingFeature tests and the live-HTTP probe are not CI-safe.
      - name: Run runtime behavior regression tests
        id: tests
        shell: pwsh
        run: |
          dotnet test src/Snap.Hutao.Remastered/Snap.Hutao.Remastered.Test/Snap.Hutao.Remastered.Test.csproj -c Release --filter "FullyQualifiedName~Snap.Hutao.Remastered.Test.RuntimeBehavior" --logger "trx;LogFileName=regression-tests.trx" --results-directory "$env:RUNNER_TEMP/test-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: alpha-runtime-regression-results
          path: ${{ runner.temp }}/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare optional bundled image snapshot
        shell: pwsh
        run: ./scripts/Get-BundledImages.ps1
        env:
          BUNDLED_IMAGES_URL: ${{ vars.BUNDLED_IMAGES_URL }}
          BUNDLED_IMAGES_VERSION: ${{ vars.BUNDLED_IMAGES_VERSION }}
          BUNDLED_IMAGES_SHA256: ${{ vars.BUNDLED_IMAGES_SHA256 }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cake (MSIX)
        id: cake
        shell: pwsh
        run: dotnet tool restore && dotnet cake
        env:
          VERSION_API_TOKEN: ${{ secrets.VERSION_API_TOKEN }}
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          PW: ${{ secrets.PW }}

      - name: Build installer
        id: build
        shell: pwsh
        run: dotnet cake build-installer.cake
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          PW: ${{ secrets.PW }}

      - name: Create Store upload
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $symbols = Get-ChildItem src/Snap.Hutao.Remastered/Snap.Hutao.Remastered/bin/x64/Release -Recurse -Filter Snap.Hutao.Remastered.pdb |
            Where-Object { $_.Directory.Name -eq 'publish' } | Select-Object -First 1
          Get-ChildItem src/output -Filter *.msix | ForEach-Object {
            $arguments = @{ PackagePath = $_.FullName }
            if ($symbols) { $arguments.SymbolsPath = $symbols.FullName }
            ./scripts/New-MsixUpload.ps1 @arguments
          }

      - name: Upload Store submission files
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered-Store-upload
          path: ${{ github.workspace }}/src/output/*.msixupload
          if-no-files-found: error

      - name: Upload signed msix
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Alpha-${{ steps.cake.outputs.version }}
          path: ${{ github.workspace }}/src/output/Snap.Hutao.Remastered.Alpha-${{ steps.cake.outputs.version }}.msix

      - name: Upload installer
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Alpha-Setup-${{ steps.build.outputs.version }}
          path: ${{ github.workspace }}/publish/Snap.Hutao.Remastered-*.exe

      - name: Upload code-signing certificate
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Alpha-SnapHutaoRemasteringProject-${{ steps.build.outputs.version }}
          path: ${{ github.workspace }}/temp-code-signing.cer

      - name: Add summary
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $summary = "
          > [!WARNING]
          > 该版本是由 CI 程序自动打包生成的 Alpha 测试版本，包含已经基本完工的新功能及问题修复

          > [!IMPORTANT]
          > 直接旁加载 MSIX 时，请将 SnapHutaoRemasteringProject 工件中的证书安装到 **受信任的人员（TrustedPeople）** 存储
          "
          echo $summary >> $Env:GITHUB_STEP_SUMMARY

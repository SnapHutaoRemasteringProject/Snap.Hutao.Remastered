name: Snap Hutao Remastered Canary
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - release
      - dependabot/**
    paths-ignore:
      - '.gitattributes'
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.yml'

jobs:
  prepare:
    name: Prepare shared Canary source
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      continue: ${{ steps.merge.outputs.continue }}
      source-sha: ${{ steps.merge.outputs.source-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge all branches into dev locally
        id: merge
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/PrepareCanarySource.ps1
      - name: Bundle the exact merged source
        if: ${{ steps.merge.outputs.continue == 'true' }}
        shell: pwsh
        run: |
          git bundle create "$env:RUNNER_TEMP/source.bundle" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot bundle prepared Canary source' }
      - name: Share prepared source with both runtimes
        if: ${{ steps.merge.outputs.continue == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Canary-Prepared-Source
          path: ${{ runner.temp }}/source.bundle
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.continue == 'true' }}
    name: Build (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: R2R
            publish_aot: false
            suffix: ''
            appinstaller_subdir: ''
          - runtime: NativeAOT
            publish_aot: true
            suffix: '-AOT'
            appinstaller_subdir: 'AOT'
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download prepared Canary source
        uses: actions/download-artifact@v8
        with:
          name: Canary-Prepared-Source
          path: ${{ runner.temp }}/canary-source

      - name: Check out the shared merged commit
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: |
          git fetch "$env:RUNNER_TEMP/canary-source/source.bundle" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch prepared Canary source' }
          git checkout --detach $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check out prepared Canary source' }
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Canary source mismatch' }

      - name: Prepare optional bundled image snapshot
        if: ${{ needs.prepare.outputs.continue == 'true' }}
        shell: pwsh
        run: ./scripts/Get-BundledImages.ps1
        env:
          BUNDLED_IMAGES_URL: ${{ vars.BUNDLED_IMAGES_URL }}
          BUNDLED_IMAGES_VERSION: ${{ vars.BUNDLED_IMAGES_VERSION }}
          BUNDLED_IMAGES_SHA256: ${{ vars.BUNDLED_IMAGES_SHA256 }}

      - name: Setup .NET
        if: ${{ needs.prepare.outputs.continue == 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11

      - name: Cache NuGet packages
        if: ${{ needs.prepare.outputs.continue == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cake (MSIX)
        if: ${{ needs.prepare.outputs.continue == 'true' }}
        id: cake
        shell: pwsh
        run: dotnet tool restore && dotnet cake --publishAot=${{ matrix.publish_aot }} --enableCanaryAppPackages=true
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          PW: ${{ secrets.PW }}

      - name: Upload Native AOT MSIX symbols
        if: ${{ matrix.runtime == 'NativeAOT' }}
        uses: actions/upload-artifact@v7
        with:
          name: NativeAOT-MSIX-Symbols-${{ steps.cake.outputs.version }}
          path: ${{ github.workspace }}/artifacts/nativeaot-symbols/Snap.Hutao.Remastered.pdb
          if-no-files-found: error

      - name: Upload signed msix
        if: ${{ success() && needs.prepare.outputs.continue == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Canary-${{ steps.cake.outputs.version }}${{ matrix.suffix }}
          path: ${{ github.workspace }}/src/output/Snap.Hutao.Remastered.Canary-${{ steps.cake.outputs.version }}${{ matrix.suffix }}.msix

      - name: Upload Canary AppPackages (GitHub artifact only)
        if: ${{ success() && needs.prepare.outputs.continue == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Canary-AppPackages-${{ matrix.runtime }}
          path: ${{ github.workspace }}/AppPackages/Canary/${{ matrix.appinstaller_subdir }}
          if-no-files-found: error

      - name: Export sideload trust certificate
        if: ${{ success() && needs.prepare.outputs.continue == 'true' }}
        shell: pwsh
        run: ./scripts/Export-PackageCertificate.ps1 -PfxPath 'temp.pfx' -OutputPath 'temp-code-signing.cer'
        env:
          PW: ${{ secrets.PW }}

      - name: Upload code-signing certificate
        if: ${{ success() && needs.prepare.outputs.continue == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Canary-SnapHutaoRemasteringProject-${{ steps.cake.outputs.version }}${{ matrix.suffix }}
          path: ${{ github.workspace }}/temp-code-signing.cer

      - name: Add summary
        if: ${{ success() && needs.prepare.outputs.continue == 'true' }}
        shell: pwsh
        run: |
          $summary = "
          构建模式：${{ matrix.runtime }}

          > [!WARNING]
          > 该版本是由 CI 程序自动打包生成的 Canary 测试版本，包含新功能原型及问题修复

          > [!IMPORTANT]
          > 直接旁加载 MSIX 时，请将 SnapHutaoRemasteringProject 工件中的证书安装到 **受信任的人员（TrustedPeople）** 存储
          "

          echo $summary >> $Env:GITHUB_STEP_SUMMARY

  publish_r2:
    name: Publish Canary App Installer (disabled)
    needs: build
    # Canary AppPackages are built for CI verification but intentionally not copied to R2.
    if: ${{ false }}
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: r2-canary
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Canary R2R AppPackages
        uses: actions/download-artifact@v8
        with:
          name: Canary-AppPackages-R2R
          path: ${{ github.workspace }}/AppPackages/Canary

      - name: Download Canary NativeAOT AppPackages
        uses: actions/download-artifact@v8
        with:
          name: Canary-AppPackages-NativeAOT
          path: ${{ github.workspace }}/AppPackages/Canary/AOT

      - name: Install rclone
        shell: pwsh
        run: |
          choco install rclone --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'rclone installation failed.' }

      - name: Replace Canary App Installer feeds
        shell: pwsh
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          ./scripts/Publish-AppPackagesToR2.ps1 -AppPackagesPath 'AppPackages' -Channel Canary -RuntimeKind R2R
          if ($LASTEXITCODE -ne 0) { throw 'Canary R2R publication failed.' }
          ./scripts/Publish-AppPackagesToR2.ps1 -AppPackagesPath 'AppPackages' -Channel Canary -RuntimeKind NativeAOT
          if ($LASTEXITCODE -ne 0) { throw 'Canary NativeAOT publication failed.' }

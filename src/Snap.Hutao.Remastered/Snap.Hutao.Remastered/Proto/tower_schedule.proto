syntax = "proto3";

package snap.hutao.remastered.metadata;

// ============================================================================
// Tower schedule
// ============================================================================

message TowerSchedule {
  uint32 id = 1;
  repeated uint32 floor_ids = 2;
  string open = 3;
  string close = 4;
  string buff_name = 5;
  repeated string descriptions = 6;
  string icon = 7;
}

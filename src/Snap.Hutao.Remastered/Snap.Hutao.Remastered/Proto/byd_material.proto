syntax = "proto3";

package snap.hutao.remastered.metadata;

import "enums.proto";

// ============================================================================
// Beyond-material item
// ============================================================================

message BydMaterial {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  BydMaterialType type = 5;
  uint32 rank_level = 6;
}

name: Snap Hutao Remastered Alpha
on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    paths-ignore:
      - '.gitattributes'
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.yml'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - '.gitattributes'
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.yml'
      - '**.resx'

jobs:
  test:
    name: Full test suite (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build test project
        shell: pwsh
        run: |
          dotnet build src/Snap.Hutao.Remastered/Snap.Hutao.Remastered.Test/Snap.Hutao.Remastered.Test.csproj -c ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Discover complete test suite
        shell: pwsh
        run: |
          dotnet test src/Snap.Hutao.Remastered/Snap.Hutao.Remastered.Test/Snap.Hutao.Remastered.Test.csproj -c ${{ matrix.configuration }} --no-build --list-tests | Tee-Object -FilePath "$env:RUNNER_TEMP/test-discovery.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete test suite
        id: tests
        shell: pwsh
        run: |
          dotnet test src/Snap.Hutao.Remastered/Snap.Hutao.Remastered.Test/Snap.Hutao.Remastered.Test.csproj -c ${{ matrix.configuration }} --no-build --logger "trx;LogFileName=full-tests.trx" --results-directory "$env:RUNNER_TEMP/test-results" -- RunConfiguration.TreatNoTestsAsError=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test discovery and results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: alpha-full-test-results-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/test-results/*.trx
            ${{ runner.temp }}/test-discovery.txt
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build Native AOT
    runs-on: windows-latest
    outputs:
      version: ${{ steps.cake.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare optional bundled image snapshot
        shell: pwsh
        run: ./scripts/Get-BundledImages.ps1
        env:
          BUNDLED_IMAGES_URL: ${{ vars.BUNDLED_IMAGES_URL }}
          BUNDLED_IMAGES_VERSION: ${{ vars.BUNDLED_IMAGES_VERSION }}
          BUNDLED_IMAGES_SHA256: ${{ vars.BUNDLED_IMAGES_SHA256 }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cake (MSIX)
        id: cake
        shell: pwsh
        run: dotnet tool restore && dotnet cake --publishAot=true
        env:
          VERSION_API_TOKEN: ${{ secrets.VERSION_API_TOKEN }}
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          PW: ${{ secrets.PW }}

      - name: Upload Native AOT MSIX symbols
        uses: actions/upload-artifact@v7
        with:
          name: NativeAOT-MSIX-Symbols-${{ steps.cake.outputs.version }}
          path: ${{ github.workspace }}/artifacts/nativeaot-symbols/Snap.Hutao.Remastered.pdb
          if-no-files-found: error

      - name: Upload Native AOT symbols to Sentry
        if: ${{ github.repository_owner == 'SnapHutaoRemasteringProject' && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}
        continue-on-error: true
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
        run: |
          npx.cmd --yes --package=@sentry/cli sentry-cli debug-files upload --org snaphutaoremasteringproject --project snap-hutao-remastered artifacts/nativeaot-symbols/Snap.Hutao.Remastered.pdb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload signed msix
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Alpha-${{ steps.cake.outputs.version }}
          path: ${{ github.workspace }}/src/output/Snap.Hutao.Remastered.Alpha-${{ steps.cake.outputs.version }}.msix

      - name: Upload Alpha AppPackages for R2 publication
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: Alpha-AppPackages
          path: ${{ github.workspace }}/AppPackages/Alpha
          if-no-files-found: error

      - name: Export sideload trust certificate
        if: ${{ success() && github.event_name != 'pull_request' }}
        shell: pwsh
        run: ./scripts/Export-PackageCertificate.ps1 -PfxPath 'temp.pfx' -OutputPath 'temp-code-signing.cer'
        env:
          PW: ${{ secrets.PW }}

      - name: Upload code-signing certificate
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Alpha-SnapHutaoRemasteringProject-${{ steps.cake.outputs.version }}
          path: ${{ github.workspace }}/temp-code-signing.cer

      - name: Add summary
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $summary = "
          构建模式：Native AOT

          > [!WARNING]
          > 该版本是由 CI 程序自动打包生成的 Alpha 测试版本，包含已经基本完工的新功能及问题修复

          > [!IMPORTANT]
          > 直接旁加载 MSIX 时，请将 SnapHutaoRemasteringProject 工件中的证书安装到 **受信任的人员（TrustedPeople）** 存储
          "
          echo $summary >> $Env:GITHUB_STEP_SUMMARY

  publish_mirrorchyan:
    name: Publish Alpha MSIX to MirrorChyan
    needs: [build, test]
    if: ${{ github.repository_owner == 'SnapHutaoRemasteringProject' && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download signed Alpha MSIX
        uses: actions/download-artifact@v8
        with:
          name: Snap.Hutao.Remastered.Alpha-${{ needs.build.outputs.version }}

      - name: Upload Alpha MSIX
        uses: MirrorChyan/uploading-action@v1
        with:
          filetype: local
          filename: Snap.Hutao.Remastered.Alpha-${{ needs.build.outputs.version }}.msix
          version_name: ${{ needs.build.outputs.version }}
          mirrorchyan_rid: SnapHutaoRemastered_msix
          os: win
          arch: x64
          channel: alpha
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  publish_r2:
    name: Publish Alpha App Installer
    needs: [build, test]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: r2-alpha
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Alpha AppPackages
        uses: actions/download-artifact@v8
        with:
          name: Alpha-AppPackages
          path: ${{ github.workspace }}/AppPackages/Alpha

      - name: Install rclone
        shell: pwsh
        run: |
          choco install rclone --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'rclone installation failed.' }

      - name: Replace Alpha App Installer feeds
        shell: pwsh
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          ./scripts/Publish-AppPackagesToR2.ps1 -AppPackagesPath 'AppPackages' -Channel Alpha
          if ($LASTEXITCODE -ne 0) { throw 'Alpha publication failed.' }

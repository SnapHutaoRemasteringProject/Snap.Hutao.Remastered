name: Snap Hutao Remastered Publish (SignPath)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare optional bundled image snapshot
        shell: pwsh
        run: ./scripts/Get-BundledImages.ps1
        env:
          BUNDLED_IMAGES_URL: ${{ vars.BUNDLED_IMAGES_URL }}
          BUNDLED_IMAGES_VERSION: ${{ vars.BUNDLED_IMAGES_VERSION }}
          BUNDLED_IMAGES_SHA256: ${{ vars.BUNDLED_IMAGES_SHA256 }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build and zip
        id: build
        shell: pwsh
        run: dotnet tool restore && dotnet cake publish_signpath.cake --target=BuildAndZip

      - name: Upload unsigned zip
        id: upload-zip
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered-${{ steps.build.outputs.version }}-unsigned-zip
          path: ${{ steps.build.outputs.zip-path }}
          archive: false

      - name: Submit zip to SignPath for signing
        id: signpath-zip
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ba79caf8-8aa3-44e6-8a7b-ac8541512be4
          project-slug: Snap.Hutao.Remastered
          signing-policy-slug: release-signing
          artifact-configuration-slug: zip
          github-artifact-id: ${{ steps.upload-zip.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/src/output/signed-zip
          skip-decompress: true

      - name: Package installer and MSIX from signed files
        id: package
        shell: pwsh
        run: dotnet cake publish_signpath.cake --target=PackageFromSigned --signedZipDir="${{ github.workspace }}/src/output/signed-zip"
        env:
          PUBLISH_CERT: ${{ secrets.PUBLISH_CERT }}
          PUBLISH_PW: ${{ secrets.PUBLISH_PW }}

      - name: Upload unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered-${{ steps.build.outputs.version }}-unsigned-installer
          path: ${{ steps.package.outputs.installer-path }}

      - name: Submit installer to SignPath for signing
        id: signpath-installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ba79caf8-8aa3-44e6-8a7b-ac8541512be4
          project-slug: Snap.Hutao.Remastered
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/src/output/signed-installer

      - name: Create Store upload
        shell: pwsh
        run: |
          $symbols = Get-ChildItem src/Snap.Hutao.Remastered/Snap.Hutao.Remastered/bin/x64/Release -Recurse -Filter Snap.Hutao.Remastered.pdb |
            Where-Object { $_.Directory.Name -eq 'publish' } | Select-Object -First 1
          Get-ChildItem src/output -Filter *.msix | ForEach-Object {
            $arguments = @{ PackagePath = $_.FullName }
            if ($symbols) { $arguments.SymbolsPath = $symbols.FullName }
            ./scripts/New-MsixUpload.ps1 @arguments
          }

      - name: Upload Store submission files
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered-Store-upload
          path: ${{ github.workspace }}/src/output/*.msixupload
          if-no-files-found: error

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered-${{ steps.build.outputs.version }}-MSIX-${{ steps.package.outputs.msix-signed == 'true' && 'signed' || 'unsigned-store-only' }}
          path: ${{ steps.package.outputs.msix-path }}

      - name: Upload signed installer
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered-${{ steps.build.outputs.version }}-signed-installer
          path: ${{ github.workspace }}/src/output/signed-installer

      - name: Install rclone
        shell: pwsh
        run: |
          choco install rclone --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'rclone installation failed.' }

      - name: Publish default installer to R2
        id: r2
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          $filename = "Snap.Hutao.Remastered-$env:RELEASE_VERSION-Setup.exe"
          $installers = @(Get-ChildItem 'src/output/signed-installer' -Recurse -File -Filter $filename)
          if ($installers.Count -ne 1) { throw "Expected exactly one signed default installer: $filename" }
          ./scripts/Publish-InstallerToR2.ps1 -InstallerPath $installers[0].FullName

      - name: Add summary
        shell: pwsh
        run: |
          $summary = @"
          ## Snap Hutao Remastered Publish Build (SignPath Release Signing)

          - **Version:** ${{ steps.build.outputs.version }}
          - **Signing Policy:** release-signing (zip / installer)
          - **MSIX signed:** ${{ steps.package.outputs.msix-signed }}
          - **Zip Signing Request:** ${{ steps.signpath-zip.outputs.signing-request-web-url }}
          - **Installer Signing Request:** ${{ steps.signpath-installer.outputs.signing-request-web-url }}

          > [!IMPORTANT]
          > zip/安装器使用 SignPath 签名。MSIX 证书与商店 Publisher 不匹配时保持未签名，仅用于商店提交，不可旁加载；请提交 Store-upload 工件内的 .msixupload。
          "@
          echo $summary >> $Env:GITHUB_STEP_SUMMARY

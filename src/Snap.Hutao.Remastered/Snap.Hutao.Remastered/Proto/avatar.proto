syntax = "proto3";

package snap.hutao.remastered.metadata;

import "enums.proto";

// ============================================================================
// Avatar
// ============================================================================

message Avatar {
  uint32 id = 1;
  uint32 promote_id = 2;
  uint32 sort = 3;
  BodyType body = 4;
  string icon = 5;
  string side_icon = 6;
  string name = 7;
  string description = 8;
  string begin_time = 9;
  QualityType quality = 10;
  WeaponType weapon = 11;
  AvatarBaseValue base_value = 12;
  repeated AvatarGrowCurveData grow_curves = 13;
  AvatarSkillDepot skill_depot = 14;
  AvatarFetterInfo fetter_info = 15;
  repeated AvatarCostume costumes = 16;
  repeated uint32 cultivation_items = 17;
  AvatarNameCard name_card = 18;
  AvatarTraceEffect trace_effect = 19;
}

message AvatarBaseValue {
  double hp_base = 1;
  double attack_base = 2;
  double defense_base = 3;
}

message AvatarGrowCurveData {
  FightProperty type = 1;
  GrowCurveValue value = 2;
}

message AvatarSkillDepot {
  Arkhe arkhe = 1;
  repeated AvatarSkill skills = 2;
  repeated AvatarSkill special_skills = 3;
  AvatarSkill energy_skill = 4;
  repeated AvatarSkill inherents = 5;
  repeated AvatarTalent talents = 6;
}

message AvatarSkill {
  uint32 group_id = 1;
  SkillProud proud = 2;
  uint32 id = 3;
  string name = 4;
  string description = 5;
  string special_description = 6;
  EnergyType special_energy_type = 7;
  string icon = 8;
  float cd_time = 9;
}

message SkillProud {
  repeated string descriptions = 1;
  repeated SkillParameter parameters = 2;
  repeated int32 description_list = 3;
  repeated int32 special_description_list = 4;
  DisplayType display = 5;
}

message SkillParameter {
  uint32 id = 1;
  uint32 level = 2;
  repeated double parameters = 3;
}

message AvatarTalent {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string special_description = 4;
  string icon = 5;
  TalentExtraLevel extra_level = 6;
}

message TalentExtraLevel {
  uint32 index = 1;
  uint32 level = 2;
}

message AvatarFetterInfo {
  string title = 1;
  string detail = 2;
  AssociationType association = 3;
  string native = 4;
  uint32 birth_month = 5;
  uint32 birth_day = 6;
  string vision_before = 7;
  string vision_after = 8;
  string vision_override_locked = 9;
  string vision_override_unlocked = 10;
  string constellation_before = 11;
  string constellation_after = 12;
  string cv_chinese = 13;
  string cv_japanese = 14;
  string cv_english = 15;
  string cv_korean = 16;
  CookBonus cook_bonus = 17;
  repeated Fetter fetters = 18;
  repeated FetterStory fetter_stories = 19;
}

message Fetter {
  string title = 1;
  string context = 2;
}

message FetterStory {
  string title = 1;
  string context = 2;
}

message CookBonus {
  uint32 origin_item_id = 1;
  uint32 item_id = 2;
  repeated uint32 input_list = 3;
}

message AvatarCostume {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  bool is_default = 4;
  string front_icon = 5;
  string side_icon = 6;
}

message AvatarNameCard {
  string name = 1;
  string description = 2;
  string icon = 3;
  string picture_prefix = 4;
}

message AvatarTraceEffect {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
}

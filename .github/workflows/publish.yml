name: Snap Hutao Remastered Publish
on:
  workflow_dispatch:

concurrency:
  group: r2-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: R2R
            publish_aot: false
            suffix: ''
            appinstaller_subdir: ''
          - runtime: NativeAOT
            publish_aot: true
            suffix: '-AOT'
            appinstaller_subdir: 'AOT'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare optional bundled image snapshot
        shell: pwsh
        run: ./scripts/Get-BundledImages.ps1
        env:
          BUNDLED_IMAGES_URL: ${{ vars.BUNDLED_IMAGES_URL }}
          BUNDLED_IMAGES_VERSION: ${{ vars.BUNDLED_IMAGES_VERSION }}
          BUNDLED_IMAGES_SHA256: ${{ vars.BUNDLED_IMAGES_SHA256 }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish Store MSIX and R2 AppPackages
        id: publish
        shell: pwsh
        run: dotnet tool restore && dotnet cake publish.cake --publishAot=${{ matrix.publish_aot }}
        env:
          PUBLISH_CERT: ${{ secrets.PUBLISH_CERT }}
          PUBLISH_PW: ${{ secrets.PUBLISH_PW }}

      - name: Upload Native AOT symbols
        if: ${{ matrix.runtime == 'NativeAOT' }}
        uses: actions/upload-artifact@v7
        with:
          name: NativeAOT-Symbols-${{ steps.publish.outputs.version }}
          path: ${{ github.workspace }}/artifacts/nativeaot-symbols/Snap.Hutao.Remastered.pdb
          if-no-files-found: error

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered-${{ steps.publish.outputs.version }}-MSIX-${{ steps.publish.outputs.msix-signed == 'true' && 'signed' || 'unsigned-store-only' }}${{ matrix.suffix }}
          path: ${{ github.workspace }}/src/output/Snap.Hutao.Remastered-${{ steps.publish.outputs.version }}${{ matrix.suffix }}.msix
          archive: false

      - name: Upload R2 AppPackages
        uses: actions/upload-artifact@v7
        with:
          name: Publish-AppPackages-${{ matrix.runtime }}
          path: ${{ github.workspace }}/AppPackages/Publish/${{ matrix.appinstaller_subdir }}
          if-no-files-found: error

      - name: Upload code-signing certificate
        if: ${{ matrix.runtime == 'R2R' }}
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered-SnapHutaoRemasteringProject-${{ steps.publish.outputs.version }}${{ matrix.suffix }}
          path: ${{ github.workspace }}/temp-code-signing.cer
          archive: false

      - name: Add summary
        shell: pwsh
        run: |
          $summary = @"
          ## Snap Hutao Remastered Release Build

          - **Runtime:** ${{ matrix.runtime }}
          - **Version:** ${{ steps.publish.outputs.version }}
          - **Store MSIX:** Snap.Hutao.Remastered-${{ steps.publish.outputs.version }}${{ matrix.suffix }}.msix
          - **Store MSIX signed:** ${{ steps.publish.outputs.msix-signed }}
          - **R2 sideload:** ${{ matrix.runtime == 'R2R' && 'Snap.Hutao.Remastered.Publish.x64.appinstaller' || 'Snap.Hutao.Remastered.Publish.AOT.x64.appinstaller' }}

          > [!IMPORTANT]
          > 商店包保持原有身份；普通版和 AOT 版会分别生成签名侧载 MSIX，发布到各自的 R2 更新源。商店与侧载渠道不可直接交叉升级。
          "@
          echo $summary >> $Env:GITHUB_STEP_SUMMARY

  publish_r2:
    name: Publish both runtime variants to R2
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Publish AppPackages
        uses: actions/download-artifact@v8
        with:
          name: Publish-AppPackages-R2R
          path: ${{ github.workspace }}/AppPackages/Publish

      - name: Download Publish AOT AppPackages
        uses: actions/download-artifact@v8
        with:
          name: Publish-AppPackages-NativeAOT
          path: ${{ github.workspace }}/AppPackages/Publish/AOT

      - name: Install rclone
        shell: pwsh
        run: |
          choco install rclone --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'rclone installation failed.' }

      - name: Replace both runtime feeds
        shell: pwsh
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          ./scripts/Publish-AppPackagesToR2.ps1 -AppPackagesPath 'AppPackages' -Channel Publish -RuntimeKind R2R
          if ($LASTEXITCODE -ne 0) { throw 'Publish R2R upload failed.' }
          ./scripts/Publish-AppPackagesToR2.ps1 -AppPackagesPath 'AppPackages' -Channel Publish -RuntimeKind NativeAOT
          if ($LASTEXITCODE -ne 0) { throw 'Publish AOT upload failed.' }
